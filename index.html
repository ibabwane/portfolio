<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Iqbal Babwane — Data Analyst & ML Enthusiast</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    :root{
      --bg:#081426;
      --card:#0f1724;
      --accent:#06b6d4;
      --text:#eef6fb;
      --muted:#99a7b8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      background:linear-gradient(180deg,var(--bg),#0b2030);
      color:var(--text);
    }
    .wrap{max-width:1000px;margin:32px auto;padding:24px}
    .top{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
    .photo{
      width:220px;
      height:220px;
      border-radius:16px;
      overflow:hidden;
      border:4px solid rgba(255,255,255,0.08);
      background:linear-gradient(135deg,var(--accent),#3b82f6);
      flex:0 0 220px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 8px 25px rgba(0,0,0,0.4);
    }
    .photo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    h1{margin:0;font-size:32px;color:var(--accent)}
    .subtitle{color:var(--muted);margin-top:6px;font-size:18px}
    .contact{margin-top:10px;color:var(--muted);font-size:14px}
    .btn{
      display:inline-block;
      margin-top:10px;
      padding:10px 16px;
      border-radius:8px;
      background:var(--accent);
      color:#042433;
      text-decoration:none;
      font-weight:600;
      font-size:14px;
    }
    .grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:26px}
    @media(min-width:880px){.grid{grid-template-columns:2fr 1fr}}
    .card{background:var(--card);padding:20px;border-radius:12px;box-shadow:0 8px 20px rgba(2,8,18,0.6)}
    h2{color:var(--accent);margin:0 0 10px 0}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      background:rgba(255,255,255,0.03);
      padding:8px 12px;
      border-radius:999px;
      color:var(--text);
      font-size:13px;
      border:1px solid rgba(255,255,255,0.02);
    }
    .projects{display:grid;gap:16px}
    .proj{
      padding:14px;
      border-radius:10px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    }
    .proj h3{margin:0 0 8px 0;font-size:16px}
    .proj p{margin:0;color:var(--muted);font-size:14px}
    footer{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}
  </style>
</head>
